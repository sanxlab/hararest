name: Temporary Heroku lyrics diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install Heroku CLI
        run: |
          curl --fail --silent --show-error https://cli-assets.heroku.com/install.sh -o /tmp/install-heroku.sh
          sh /tmp/install-heroku.sh
      - name: Inspect safe lyrics metadata in Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: python3 scripts/run-youtube-lyrics-diagnostic.py
