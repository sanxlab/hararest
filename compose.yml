services:
  hararest:
    build: .
    init: true
    environment:
      YTDLP_POT_PROVIDER_URL: '${YTDLP_POT_PROVIDER_URL:-http://bgutil-provider:4416}'
    env_file:
      - path: .env
        required: false
    ports:
      - '${TAILSCALE_IP:-127.0.0.1}:8080:1337'
    volumes:
      - ./cookies:/app/cookies
    depends_on:
      - bgutil-provider
    networks:
      - hararest-network

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    init: true
    networks:
      - hararest-network

networks:
  hararest-network:
    driver: bridge
