name: CI and Heroku deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hararest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand --roots src
      - run: npm run lint
      - run: npm run build

  container:
    name: Build, smoke test, and deploy container
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --platform linux/amd64 --tag hararest:ci .
      - name: Smoke test as a non-root Heroku-style user
        run: |
          docker run --detach --name hararest-ci --user 12345:12345 \
            --publish 127.0.0.1:18080:18080 --env PORT=18080 --env TRUST_PROXY_HOPS=1 \
            --env YTDLP_COOKIES_BASE64="$(printf '# Netscape HTTP Cookie File\n.youtube.com\tTRUE\t/\tTRUE\t2147483647\tfixture\tci-only\n' | base64 -w0)" \
            hararest:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/health > /dev/null; then
              docker exec hararest-ci node -e "try { require.resolve('puppeteer'); process.exit(1); } catch (err) { if (err.code !== 'MODULE_NOT_FOUND') throw err; }"
              exit 0
            fi
            sleep 2
          done
          docker logs hararest-ci
          exit 1
      - name: Check runtime cookie restoration and writable storage
        run: |
          docker exec -i hararest-ci node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { config } = require('./dist/config/default');
          assert.equal(config.port, 18080);
          assert.equal(config.trustProxyHops, 1);
          assert.equal(fs.statSync(config.youtube.cookiePath).mode & 0o777, 0o600);
          assert.ok(fs.readFileSync(config.youtube.cookiePath, 'utf8').includes('ci-only'));
          fs.accessSync(config.youtube.tmpDir, fs.constants.W_OK);
          fs.rmSync(path.dirname(config.youtube.cookiePath), { recursive: true });
          console.log('Runtime cookies and temporary storage passed');
          JS
      - name: Stop smoke-test container
        if: always()
        run: docker rm --force hararest-ci || true
      - name: Deploy tested image to Heroku
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -euo pipefail
          : "${HEROKU_API_KEY:?Set HEROKU_API_KEY in GitHub Actions secrets}"
          : "${HEROKU_APP_NAME:?Set HEROKU_APP_NAME in GitHub Actions secrets}"
          curl --fail --silent --show-error https://cli-assets.heroku.com/install.sh -o /tmp/install-heroku.sh
          sh /tmp/install-heroku.sh
          printf '%s' "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          docker tag hararest:ci "registry.heroku.com/$HEROKU_APP_NAME/web"
          docker push "registry.heroku.com/$HEROKU_APP_NAME/web"
          heroku container:release web --app "$HEROKU_APP_NAME"
      - name: Log out of registry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout registry.heroku.com
